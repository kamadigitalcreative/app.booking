<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booking - Kama Visual</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS v3 CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gradient-to-br from-indigo-100 via-purple-100 to-pink-100 min-h-screen font-sans text-slate-800 antialiased flex flex-col justify-center items-center p-4 py-8">

  <!-- LOADING SPINNER -->
  <div id="fullPageLoader" class="fixed inset-0 z-[9999] bg-white/40 backdrop-blur-md flex flex-col justify-center items-center">
    <div class="spinner-border text-indigo-600 mb-4" role="status" style="width: 3.5rem; height: 3.5rem;"></div>
    <h5 class="font-extrabold text-xl text-indigo-700">Memuat Layanan...</h5>
  </div>

  <div class="w-full max-w-xl my-auto">
    <div class="bg-white/30 backdrop-blur-md border border-white/50 shadow-2xl rounded-3xl overflow-hidden">
      
      <!-- HEADER -->
      <div class="bg-gradient-to-r from-indigo-600 to-purple-600 p-8 text-center text-white">
        <div class="w-16 h-16 rounded-2xl bg-white text-indigo-600 font-extrabold text-2xl flex items-center justify-center mx-auto mb-3 shadow-lg">km</div>
        <h3 class="text-2xl font-extrabold tracking-tight">Booking Layanan</h3>
        <p class="text-xs text-white/80 mt-1 font-medium">Pilih paket dan tentukan jadwal pemotretan Anda.</p>
      </div>

      <div class="p-6 md:p-8">
        <form id="bookingForm" onsubmit="submitBooking(event)" class="space-y-6">
          
          <!-- SECTION 1: Personal Info -->
          <div class="space-y-4">
            <h6 class="font-bold text-xs uppercase tracking-wider text-indigo-900 flex items-center gap-2">
              <i class="fa-solid fa-user text-indigo-600"></i> Informasi Data Diri
            </h6>
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">Nama Lengkap *</label>
              <input type="text" id="clientName" class="w-full px-4 py-3 bg-white/40 border border-white/60 backdrop-blur-sm rounded-xl text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:bg-white/60 text-xs font-medium" required placeholder="Cth: Budi Santoso">
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">No. WhatsApp *</label>
              <input type="tel" id="clientPhone" class="w-full px-4 py-3 bg-white/40 border border-white/60 backdrop-blur-sm rounded-xl text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:bg-white/60 text-xs font-medium" required placeholder="Cth: 08123456789">
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">Alamat / Lokasi Acara</label>
              <textarea id="clientAddress" class="w-full px-4 py-3 bg-white/40 border border-white/60 backdrop-blur-sm rounded-xl text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:bg-white/60 text-xs font-medium" rows="2" placeholder="Detail alamat..."></textarea>
            </div>
          </div>

          <!-- SECTION 2: Packages -->
          <div class="space-y-4 pt-2">
            <h6 class="font-bold text-xs uppercase tracking-wider text-indigo-900 flex items-center gap-2">
              <i class="fa-solid fa-box-open text-indigo-600"></i> Pilih Paket Layanan
            </h6>
            <div id="packagesContainer" class="grid grid-cols-1 md:grid-cols-2 gap-3">
              <!-- Dipopulasi oleh JS -->
            </div>
          </div>

          <!-- SECTION 3: Date & Details -->
          <div class="space-y-4 pt-2">
            <h6 class="font-bold text-xs uppercase tracking-wider text-indigo-900 flex items-center gap-2">
              <i class="fa-regular fa-calendar-days text-indigo-600"></i> Jadwal & Catatan
            </h6>
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">Tanggal Acara *</label>
              <input type="date" id="bookingDate" class="w-full px-4 py-3 bg-white/40 border border-white/60 backdrop-blur-sm rounded-xl text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:bg-white/60 text-xs font-medium" required>
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">Catatan Khusus (Opsional)</label>
              <textarea id="bookingNotes" class="w-full px-4 py-3 bg-white/40 border border-white/60 backdrop-blur-sm rounded-xl text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:bg-white/60 text-xs font-medium" rows="3" placeholder="Permintaan khusus..."></textarea>
            </div>
          </div>

          <button type="submit" class="w-full py-4 px-6 bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-bold text-base rounded-2xl shadow-xl shadow-indigo-500/30 hover:scale-[1.01] active:scale-[0.99] transition-all flex items-center justify-center gap-2" id="btnSubmitForm">
            Konfirmasi Booking <i class="fa-solid fa-arrow-right"></i>
          </button>
        </form>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
  <script>
    const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbx_MRP6SWoCXMqGuLaxEDWZR8CowGZ08ccICHoAfdVw6hbfz_8PJbJA2adXcJYHaGQx/exec';
    
    let allProducts = [];
    let selectedProduct = null;

    function gasApi(action, payloadData = {}) {
      let payload = { action: action, ...payloadData };
      return fetch(GAS_WEB_APP_URL, {
        redirect: "follow",
        method: "POST",
        body: JSON.stringify(payload),
        headers: { "Content-Type": "text/plain;charset=utf-8" },
      })
      .then(res => res.text())
      .then(text => JSON.parse(text));
    }

    document.addEventListener('DOMContentLoaded', () => {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('bookingDate').setAttribute('min', today);

      gasApi('getPublicProducts').then(res => {
        document.getElementById('fullPageLoader').style.display = 'none';
        if (res.success) {
          allProducts = res.data;
          renderProducts();
        } else {
          Swal.fire('Oops', 'Gagal memuat layanan', 'error');
        }
      }).catch(err => {
        document.getElementById('fullPageLoader').style.display = 'none';
        Swal.fire('Error', 'Sistem sedang sibuk. Coba lagi nanti.', 'error');
      });
    });

    function renderProducts() {
      const container = document.getElementById('packagesContainer');
      container.innerHTML = '';
      
      if(allProducts.length === 0) {
        container.innerHTML = '<div class="col-span-full p-4 rounded-2xl bg-indigo-50 border border-indigo-100 text-indigo-700 text-xs font-semibold">Belum ada layanan yang tersedia.</div>';
        return;
      }

      allProducts.forEach((prod, index) => {
        const div = document.createElement('div');
        
        let hargaFormatted = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(prod.harga || 0);

        div.innerHTML = `
          <div class="package-card p-4 rounded-2xl bg-white/40 border border-white/60 backdrop-blur-sm cursor-pointer transition-all hover:bg-white/60 hover:shadow-lg hover:-translate-y-0.5" id="card-${index}" onclick="selectPackage(${index})">
            <h6 class="font-extrabold text-sm text-slate-900 mb-1">${prod.nama_produk}</h6>
            <div class="text-sm font-extrabold text-indigo-600 mb-1.5">${hargaFormatted}</div>
            <p class="text-[11px] text-slate-500 leading-relaxed">${prod.deskripsi || ''}</p>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function selectPackage(index) {
      document.querySelectorAll('.package-card').forEach(c => {
        c.classList.remove('ring-2', 'ring-indigo-500', 'bg-indigo-50/50');
      });
      const selectedCard = document.getElementById('card-' + index);
      if(selectedCard) {
        selectedCard.classList.add('ring-2', 'ring-indigo-500', 'bg-indigo-50/50');
      }
      selectedProduct = allProducts[index];
    }

    function submitBooking(e) {
      e.preventDefault();
      
      if (!selectedProduct) {
        return Swal.fire('Perhatian', 'Silakan pilih paket layanan terlebih dahulu.', 'warning');
      }

      const clientName = document.getElementById('clientName').value;
      const clientPhone = document.getElementById('clientPhone').value;
      const clientAddress = document.getElementById('clientAddress').value;
      const bookingDate = document.getElementById('bookingDate').value;
      const bookingNotes = document.getElementById('bookingNotes').value;

      const submitBtn = document.getElementById('btnSubmitForm');
      submitBtn.innerHTML = '<i class="fas fa-circle-notch fa-spin me-2"></i> Memproses...';
      submitBtn.disabled = true;

      const bookingData = {
        client: clientName,
        phone: clientPhone,
        alamat: clientAddress,
        tanggal: bookingDate,
        catatan: bookingNotes,
        layanan: selectedProduct.nama_produk,
        harga: selectedProduct.harga,
        jumlah: 1,
        diskon: 0,
        dp: 0,
        transport: 0,
        total: selectedProduct.harga,
        is_lunas: false
      };

      gasApi('createPublicBooking', { data: bookingData }).then(res => {
        if (res.success) {
          Swal.fire({
            icon: 'success',
            title: 'Booking Berhasil!',
            text: 'Mengarahkan ke halaman tagihan...',
            timer: 2000,
            showConfirmButton: false
          }).then(() => {
            window.location.href = 'invoice.html?id=' + res.invoice_id;
          });
        } else {
          Swal.fire('Oops', res.message, 'error');
          submitBtn.innerHTML = 'Konfirmasi Booking <i class="fa-solid fa-arrow-right ms-2"></i>';
          submitBtn.disabled = false;
        }
      }).catch(err => {
        Swal.fire('Error', 'Gagal memproses booking.', 'error');
        submitBtn.innerHTML = 'Konfirmasi Booking <i class="fa-solid fa-arrow-right ms-2"></i>';
        submitBtn.disabled = false;
      });
    }
  </script>
</body>
</html>
